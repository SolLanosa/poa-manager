spring.application.name=poa-manager
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/poa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:poa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:poa}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect